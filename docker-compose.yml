services:
  ebssso:
    build: .
    ports:
      - "8080:8080"
    environment:
      - EBS_ENV=DEV
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./logs:/root/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ebssso-network

networks:
  ebssso-network:
    driver: bridge
