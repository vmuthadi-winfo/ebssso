name: Build and Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release?'
        required: true
        type: boolean
        default: false
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        type: string
        default: 'v0.0.1'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Build Linux
      run: GOOS=linux GOARCH=amd64 go build -v -o ebssso-linux-amd64

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ebssso-linux-amd64
        path: ebssso-linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    # Attempting to address missing dependencies (like gcc/mingw) or specific toolchains if needed.
    # Standard windows-latest has Go and GCC (via Strawberry Perl or similar) usually, 
    # but CGO-enabled builds might still be tricky.
    - name: Build Windows
      run: |
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"
        $env:CGO_ENABLED = "1"
        go build -v -o ebssso-windows-amd64.exe

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ebssso-windows-amd64
        path: ebssso-windows-amd64.exe

  release:
    needs: [build-linux, build-windows]
    # Run if create_release is true AND build-linux succeeded. 
    # We use always() so `build-windows` failure doesn't block this job, 
    # allowing us to check build-linux status manually.
    if: ${{ always() && github.event.inputs.create_release == 'true' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ebssso-*
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        files: |
          ebssso-linux-amd64
          ebssso-windows-amd64.exe
          deployment/deploy.sh
          deployment/ebssso.service
          config.yaml.template
          templates/*
